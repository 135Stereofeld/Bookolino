<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="labelSettings"></title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
	<h1 data-i18n="labelSettings"></h1>

	<h3 data-i18n="labelLinkBehavior"></h3>
	<label>
	  <input type="checkbox" id="openInNewTab" />
	  <span data-i18n="labelOpenInNewTab"></span>
	</label>

	<h3 data-i18n="labelLayout"></h3>
	<label>
	  <input type="checkbox" id="themeToggle"> <span data-i18n="labelDarkTheme"></span>
	</label>

	<h4 data-i18n="labelColumns"></h4>
	<select id="setColumns">
	  <option value="auto">Auto</option>
	  <option value="3">3</option>
	  <option value="5">5</option>
	  <option value="7">7</option>
	  <option value="9">9</option>
	  <option value="11">11</option>
	  <option value="13">13</option>
	  <option value="15">15</option>
	  <option value="17">17</option>
	  <option value="19">19</option>
	  <option value="21">21</option>
	</select>
	<button id="saveColumns">Speichern</button>

	<h4 data-i18n="labelBackground"></h4>
	<input type="text" id="backgroundUrlInput" placeholder="URL" style="width: 100%;" />
	<button id="saveUrlBtn" data-i18n="labelSaveBtn"></button>
	<br><br>
	<label><span data-i18n="labelUploadImage"></span>
	  <input type="file" id="backgroundFileInput" accept="image/*" />
	</label>
	<br><br>
	<button id="deleteImageBtn" data-i18n="labelDeleteBtn"></button>

	<img id="preview" alt="" />
	<script src="options.js"></script>
    <script src="translate.js"></script>	
	
	<p style="font-size:0.85em;">&copy; 2025 Thomas Hucke | Version 0.12 vom 01.09.2025</p>

</body>
</html>
